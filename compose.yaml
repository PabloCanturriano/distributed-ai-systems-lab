x-initializer: &initializer
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
    target: database
  read_only: true
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: 'no'
  environment:
    APP_MODE: local
    DB_HOST: postgres
    DB_NAME: lab

services:
  secrets:
    <<: *initializer
    user: '0:0'
    command: [node, database/dist/initialize.js, secrets]
    cap_add: [CHOWN, DAC_OVERRIDE]
    network_mode: none
    volumes:
      - postgres_data:/var/lib/lab/postgres:ro
      - admin_secret:/run/lab/admin
      - migrator_secret:/run/lab/migrator
      - seed_secret:/run/lab/seed
      - api_secret:/run/lab/api
      - worker_secret:/run/lab/worker
      - relay_secret:/run/lab/relay
      - demo_credentials:/run/lab/demo

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_USER: lab_admin
      POSTGRES_DB: lab
      POSTGRES_PASSWORD_FILE: /run/lab/admin/password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - admin_secret:/run/lab/admin:ro
    networks: [backend]
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U lab_admin -d lab]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    stop_grace_period: 15s

  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_DELETE_TOPIC_ENABLE: 'false'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backend]
    mem_limit: 1g
    healthcheck:
      test:
        [
          CMD-SHELL,
          "KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  kafka-init:
    build:
      context: .
      dockerfile: infra/kafka/Dockerfile
    environment:
      APP_MODE: local
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backend]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /opt/kafka/logs:uid=1000,gid=1000,mode=0700
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'

  redis:
    image: redis:8.10.3-trixie@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    user: redis
    command:
      [
        redis-server,
        --bind,
        0.0.0.0,
        --protected-mode,
        'no',
        --save,
        '',
        --appendonly,
        'no',
        --maxmemory,
        64mb,
        --maxmemory-policy,
        noeviction,
      ]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
    stop_grace_period: 15s

  bootstrap:
    <<: *initializer
    command: [node, database/dist/initialize.js, bootstrap]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - admin_secret:/run/lab/admin:ro
      - migrator_secret:/run/lab/migrator:ro
      - seed_secret:/run/lab/seed:ro
      - api_secret:/run/lab/api:ro
      - worker_secret:/run/lab/worker:ro
      - relay_secret:/run/lab/relay:ro

  migrate:
    <<: *initializer
    command: [node, database/dist/initialize.js, migrate]
    networks: [backend]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - migrator_secret:/run/lab/migrator:ro

  seed:
    <<: *initializer
    command: [node, database/dist/initialize.js, seed]
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - seed_secret:/run/lab/seed:ro
      - demo_credentials:/run/lab/demo

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      API_DEPENDENCIES: local
      API_PG_HOST: postgres
      API_REDIS_HOST: redis
    volumes:
      - api_secret:/run/lab/api:ro
    ports: ['127.0.0.1:${LAB_API_PORT:-3000}:3000']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backend, ingress]
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [backend]
    depends_on:
      seed:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    stop_grace_period: 15s

networks:
  ingress: {}
  backend:
    internal: true

volumes:
  kafka_data:
  postgres_data:
  admin_secret:
  migrator_secret:
  seed_secret:
  api_secret:
  worker_secret:
  relay_secret:
  demo_credentials:
